name: Abe AI
description: >-
  Abe AI was a conversational-AI platform for banks and credit unions, delivering
  a financial virtual assistant (chatbot and voice) across web, mobile, SMS, and
  smart-speaker channels so consumers could check balances, track spending, and
  bank by natural language. Founded in Orlando, Florida and backed by Techstars,
  Abe AI was acquired by Envestnet | Yodlee in 2019; its conversational-banking
  technology was folded into Yodlee's fintech data platform. The abe.ai domain now
  301-redirects to yodlee.com/fintech/conversational-ai and no longer operates an
  independent developer or API surface.
